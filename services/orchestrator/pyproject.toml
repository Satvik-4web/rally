[project]
name = "rally-orchestrator"
version = "2.0.0"
description = "RALLY 2.0 Local Orchestration Service & Build Supervisor"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.35",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.2",
    "psutil>=6.0.0",
    "mss>=9.0.2",
    "pillow>=10.0.0",
    "watchdog>=5.0.0",
    "playwright>=1.48.0",
    "pywinauto>=0.6.8; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"